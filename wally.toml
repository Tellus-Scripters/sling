[package]
name = "vetnech/sling"
description = "A fork of Sling."
version = "0.1.5-dev.2"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
repository = "https://github.com/tellus-scripters/sling"

exclude = ["**"]
include = [
    "LICENSE",
    "README.md",
    "src",
    "src/**",
    "default.project.json",
    "wally.toml",
]

[dependencies]
vide = "encodedlux/vide@0.4.2"
topbarplus = "1foreverhd/topbarplus@3.4.0"
